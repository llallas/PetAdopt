<!-- breeds.html: Displays all breed records in a table -->
{% extends "base.html" %}
{% block content %}
<h1>Breeds</h1>
<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Breed Name</th>
            <th>Species</th>
        </tr>
    </thead>
    <tbody>
        {% for breed in breeds %}
        <tr>
            <td>{{ breed.breed_id }}</td>
            <!-- Open the selected breed's detail page. -->
            <td>
                <a href="{{ url_for('breeds.breed_detail', breed_id=breed.breed_id) }}">
                    {{ breed.breed_name }}
                </a>
            </td>
            <td>{{ breed.species }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
